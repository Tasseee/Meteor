name: Build Nightfall

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: nightfall-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Read mod version
        id: version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^mod_version=//p' gradle.properties | head -n 1)"
          if [ -z "$VERSION" ]; then
            echo "mod_version is missing from gradle.properties" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build clean JAR
        run: gradle clean build --no-daemon

      - name: Verify packaged JAR and mixins
        env:
          MOD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import zipfile
          from pathlib import Path

          version = os.environ["MOD_VERSION"]
          jar = Path(f"build/libs/nightfall-{version}.jar")
          if not jar.is_file():
              raise SystemExit(f"Expected build output not found: {jar}")

          with zipfile.ZipFile(jar) as archive:
              files = set(archive.namelist())
              metadata = json.loads(archive.read("fabric.mod.json"))
              if metadata.get("version") != version:
                  raise SystemExit(
                      f"Version mismatch: fabric.mod.json={metadata.get('version')!r}, build={version!r}"
                  )

              mixins = json.loads(archive.read("nightfall.mixins.json"))
              for mixin in mixins.get("client", []):
                  class_file = f"dev/nightfall/mixin/{mixin}.class"
                  if class_file not in files:
                      raise SystemExit(f"Mixin class missing from JAR: {class_file}")

              stale_class = "dev/nightfall/mixin/CleanUi.class"
              if stale_class in files:
                  raise SystemExit(f"Stale mixin class must not be packaged: {stale_class}")

          print(f"Verified {jar.name}: metadata version and all registered mixins are consistent.")
          PY
          cp "build/libs/nightfall-${MOD_VERSION}.jar" "build/libs/nightfall-latest.jar"

      - uses: actions/upload-artifact@v4
        with:
          name: nightfall-latest
          path: build/libs/nightfall-latest.jar
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest release
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightfall-build-${{ github.run_number }}
          name: Nightfall ${{ steps.version.outputs.version }} (Build #${{ github.run_number }})
          target_commitish: main
          make_latest: true
          prerelease: false
          generate_release_notes: true
          files: build/libs/nightfall-latest.jar
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
