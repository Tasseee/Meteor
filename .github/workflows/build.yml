name: Nightfall Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master, nightfall-2.0-intelligence]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Fabric Mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Verify project files
        run: |
          ls -la
          test -f build.gradle || test -f build.gradle.kts
          test -f src/main/resources/fabric.mod.json
          test -f src/main/resources/nightfall.mixins.json

      - name: Validate Lyrics sidecar syntax
        run: python3 -m py_compile src/main/resources/nightfall-lyrics/lyrics_sidecar.py

      - name: Validate bundled blueprint database
        run: python3 -m json.tool src/main/resources/nightfall/blueprints.json > /dev/null
      - name: Validate bundled community schematic index
        run: python3 -m json.tool src/main/resources/nightfall/community_schematics.json > /dev/null

      - name: Verify embedded local model configuration
        run: |
          grep -q 'setThreads(inferenceThreads)' src/main/java/dev/nightfall/ai/LocalAIModelService.java
          grep -q 'setCtxSize(8_192)' src/main/java/dev/nightfall/ai/LocalAIModelService.java
          grep -q 'LocalAIModelService.generate(prompt' src/main/java/dev/nightfall/gui/AIChatScreen.java
          ! grep -q 'AIChatClient.request(' src/main/java/dev/nightfall/gui/AIChatScreen.java
          grep -q 'LocalVoiceClient.toggleListening' src/main/java/dev/nightfall/gui/AIChatScreen.java
          grep -q 'LocalSpeechOutput.speak(answer.text())' src/main/java/dev/nightfall/gui/AIChatScreen.java
          grep -q 'MODEL_SHA256' src/main/java/dev/nightfall/ai/LocalVoiceClient.java

      - name: Build Nightfall
        run: gradle build --no-daemon

      - name: Verify Fabric JAR metadata
        run: |
          python3 - <<'PY'
          import glob
          import json
          import zipfile

          jars = [p for p in glob.glob("build/libs/*.jar") if not p.endswith("-sources.jar")]
          if not jars:
              raise SystemExit("No distributable Nightfall JAR was produced")

          for path in jars:
              with zipfile.ZipFile(path) as jar:
                  names = set(jar.namelist())
                  if "fabric.mod.json" not in names:
                      raise SystemExit(f"{path} is missing fabric.mod.json")
                  for resource in (
                      "nightfall-lyrics/lyrics_sidecar.py",
                      "nightfall-lyrics/requirements.txt",
                      "nightfall-lyrics/requirements-windows.txt",
                      "nightfall/blueprints.json",
                      "nightfall/community_schematics.json",
                  ):
                      if resource not in names:
                          raise SystemExit(f"{path} is missing bundled resource {resource}")
                  metadata = json.loads(jar.read("fabric.mod.json"))
                  for class_file in (
                      "dev/nightfall/ai/LocalAIModelService.class",
                      "dev/nightfall/ai/LocalAIPlanner.class",
                      "dev/nightfall/ai/LocalAIResponseParser.class",
                      "dev/nightfall/ai/LocalAIToolRouter.class",
                      "dev/nightfall/ai/AILocalRuntimeContext.class",
                      "dev/nightfall/ai/LocalVoiceClient.class",
                      "dev/nightfall/ai/LocalSpeechOutput.class",
                  ):
                      if class_file not in names:
                          raise SystemExit(f"{path} is missing the local AI runtime class {class_file}")

                  nested_llama = [name for name in names
                                  if name.startswith("META-INF/jars/") and "llama" in name.lower() and name.endswith(".jar")]
                  if not nested_llama:
                      raise SystemExit(f"{path} is missing the embedded llama.cpp runtime JAR")
                  import io
                  llama_runtime_verified = False
                  for nested in nested_llama:
                      with zipfile.ZipFile(io.BytesIO(jar.read(nested))) as runtime:
                          runtime_names = set(runtime.namelist())
                          has_api = "de/kherud/llama/LlamaModel.class" in runtime_names
                          has_native = any(name.endswith(("jllama.dll", "jllama.so", "jllama.dylib"))
                                           for name in runtime_names)
                          if has_api and has_native:
                              llama_runtime_verified = True
                              break
                  if not llama_runtime_verified:
                      raise SystemExit(f"{path} has no usable embedded llama.cpp API/native runtime")

                  nested_vosk = [name for name in names
                                 if name.startswith("META-INF/jars/") and "vosk" in name.lower() and name.endswith(".jar")]
                  nested_jna = [name for name in names
                                if name.startswith("META-INF/jars/") and "jna-" in name.lower() and name.endswith(".jar")]
                  if not nested_vosk or not nested_jna:
                      raise SystemExit(f"{path} is missing the bundled Vosk or JNA runtime")
                  vosk_runtime_verified = False
                  jna_runtime_verified = False
                  for nested in nested_vosk:
                      with zipfile.ZipFile(io.BytesIO(jar.read(nested))) as runtime:
                          runtime_names = set(runtime.namelist())
                          has_api = "org/vosk/Model.class" in runtime_names and "org/vosk/Recognizer.class" in runtime_names
                          has_windows_native = any(name.startswith("win32-x86-64/") and name.endswith("libvosk.dll")
                                                   for name in runtime_names)
                          if has_api and has_windows_native:
                              vosk_runtime_verified = True
                              break
                  for nested in nested_jna:
                      with zipfile.ZipFile(io.BytesIO(jar.read(nested))) as runtime:
                          if "com/sun/jna/Native.class" in set(runtime.namelist()):
                              jna_runtime_verified = True
                              break
                  if not vosk_runtime_verified:
                      raise SystemExit(f"{path} has no Vosk Java API and bundled Windows native library")
                  if not jna_runtime_verified:
                      raise SystemExit(f"{path} has no bundled JNA runtime")
                  if "dev/nightfall/ai/AIVoiceClient.class" not in names:
                      raise SystemExit(f"{path} is missing the Nightfall voice client")
                  if "dev/nightfall/ai/SchematicManager.class" not in names:
                      raise SystemExit(f"{path} is missing the schematic importer")
                  community = json.loads(jar.read("nightfall/community_schematics.json"))
                  sources = community.get("sources", [])
                  source_ids = [entry.get("id") for entry in sources]
                  if community.get("schemaVersion") != 1 or not sources or len(source_ids) != len(set(source_ids)):
                      raise SystemExit(f"{path} contains an invalid community schematic index")
                  database = json.loads(jar.read("nightfall/blueprints.json"))
                  entries = database.get("entries", [])
                  ids = [entry.get("id") for entry in entries]
                  if database.get("schemaVersion") != 1 or not entries or len(ids) != len(set(ids)):
                      raise SystemExit(f"{path} contains an invalid blueprint database")
                  if metadata.get("id") != "nightfall":
                      raise SystemExit(f"{path} has unexpected mod id: {metadata.get('id')!r}")
                  if "dev.nightfall.Nightfall" not in metadata.get("entrypoints", {}).get("client", []):
                      raise SystemExit(f"{path} is missing the Nightfall client entrypoint")
                  print(f"Verified Fabric mod: {path} (version {metadata.get('version')})")
          PY

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Nightfall-build
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
