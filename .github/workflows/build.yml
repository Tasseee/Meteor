name: Nightfall Build

# Build and publish a downloadable JAR on every main-branch update.
on:
  push:
    branches: [main, master, 'feature/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Fabric Mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Verify project files
        run: |
          ls -la
          test -f build.gradle || test -f build.gradle.kts
          test -f src/main/resources/fabric.mod.json
          test -f src/main/resources/nightfall.mixins.json

      - name: Build Nightfall
        run: gradle build --no-daemon

      - name: Verify Fabric JAR metadata
        run: |
          python3 - <<'PY'
          import glob
          import io
          import json
          import zipfile

          jars = [p for p in glob.glob("build/libs/*.jar") if not p.endswith("-sources.jar")]
          if not jars:
              raise SystemExit("No distributable Nightfall JAR was produced")

          for path in jars:
              with zipfile.ZipFile(path) as jar:
                  names = set(jar.namelist())
                  if "fabric.mod.json" not in names:
                      raise SystemExit(f"{path} is missing fabric.mod.json")
                  metadata = json.loads(jar.read("fabric.mod.json"))
                  if metadata.get("id") != "nightfall":
                      raise SystemExit(f"{path} has unexpected mod id: {metadata.get('id')!r}")
                  if "dev.nightfall.Nightfall" not in metadata.get("entrypoints", {}).get("client", []):
                      raise SystemExit(f"{path} is missing the Nightfall client entrypoint")
                  nested_path = "META-INF/jars/seedcrackerX-2.15.6.jar"
                  if nested_path not in names:
                      raise SystemExit(f"{path} is missing bundled {nested_path}")
                  with zipfile.ZipFile(io.BytesIO(jar.read(nested_path))) as nested:
                      if "kaptainwutax/seedcrackerX/api/SeedCrackerAPI.class" not in nested.namelist():
                          raise SystemExit(f"{path} bundled SeedCrackerX JAR is missing SeedCrackerAPI.class")
                  print(f"Verified Fabric mod and bundled SeedCrackerX: {path} (version {metadata.get('version')})")
          PY

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Nightfall-build
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
