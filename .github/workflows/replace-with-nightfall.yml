name: Replace Meteor with latest Nightfall

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/replace-with-nightfall.yml"

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Meteor
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace project files with Nightfall main
        run: |
          git clone --depth 1 --branch main https://github.com/finnmika/Nightfall.git /tmp/nightfall
          rsync -a --delete --exclude='.git' --exclude='.github/workflows/build.yml' --exclude='.github/workflows/replace-with-nightfall.yml' /tmp/nightfall/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace Meteor with latest Nightfall"
          git push origin HEAD:main
